server {
    listen 80;
    absolute_redirect off;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Any path segment starting with a dot; regex beats the prefix locations below.
    location ~ /\. {
        return 404;
    }

    location = /content {
        return 301 /content/;
    }

    location /content/ {
        alias /srv/content/;
        autoindex on;
        autoindex_format json;
    }

    location / {
        root /srv/site;
    }
}
