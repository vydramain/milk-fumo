server {
    listen 80;
    absolute_redirect off;

    # Visitors only read. Anything but GET and HEAD is refused; the content is mounted read-only anyway.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Any path segment that starts with a dot.
    location ~ /\. {
        return 404;
    }

    location = /content {
        return 301 /content/;
    }

    # The folder listing is JSON: name, type, size, modification time. Files are plain GET requests.
    location /content/ {
        alias /srv/content/;
        autoindex on;
        autoindex_format json;
    }

    location / {
        root /srv/site;
    }
}
