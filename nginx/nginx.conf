server {
    listen 80;
    absolute_redirect off;

    # Error responses are drawn by the site's error.html; SSI writes the status code into it.
    error_page 400 403 404 405 414 500 503 /error.html;

    # Visitors only read. Anything but GET and HEAD is refused; the content is mounted read-only anyway.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Any path segment that starts with a dot.
    location ~ /\. {
        return 404;
    }

    location = /content {
        return 301 /content/;
    }

    # The folder listing is JSON: name, type, size, modification time. Files are plain GET requests.
    location /content/ {
        alias /srv/content/;
        autoindex on;
        autoindex_format json;
    }

    # The error page is reached only through error_page; SSI fills in the status code.
    location = /error.html {
        root /srv/site;
        internal;
        ssi on;
    }

    location / {
        root /srv/site;
    }
}
