<!doctype html>
<meta charset="utf-8">
<title>rv_font and PxPlus tables</title>
<a id="dl" download="fonts.js" hidden>Download</a>
<pre id="out"></pre>
<script>
// Page tool: builds the JavaScript bitmap tables of the site from the rv_font headers and PxPlus TTF files.
// Usage: fonts.html?src=<URL of the 3dmppc-polymer directory, with its scheme, e.g. file:///...>
// Bare path not tried. Checked: Chromium headless, file://, --allow-file-access-from-files. Not checked: Firefox.
const SRC = new URLSearchParams(location.search).get("src");
const DATA_PATH = "pdk/lib/include/pdklib/rv_font/rv_font_data.hpp";
const CYR_PATH = "pdk/lib/include/pdklib/rv_font/rv_font_cyrillic.hpp";
const EGA_PATH = "third_party/pxplus-ibm-vga/PxPlus_IBM_EGA_8x14.ttf";
const VGA_PATH = "third_party/pxplus-ibm-vga/PxPlus_IBM_VGA_9x16.ttf";
const ASCII_FIRST = 0x20, ASCII_LAST = 0x7E; // space, tilde
const ASCII_COUNT = ASCII_LAST - ASCII_FIRST + 1, ASCII_GLYPHS = ASCII_COUNT + 1; // the table ends with a notdef glyph
const CYR_IO = 0x0401, CYR_FIRST = 0x0410, CYR_LAST = 0x044F, CYR_IO_LOWER = 0x0451; // capital Io and A, small ya and io
const CYR_RANGE = CYR_LAST - CYR_FIRST + 1, CYR_GLYPHS = CYR_RANGE + 2;
const RV_ROWS = 8, BITS_PER_ROW = 8; // rv_font glyph height in bytes; one byte per row, so the 9th VGA column is dropped
const FIRST_BIT_MASK = 0x80, RGBA_STRIDE = 4, ALPHA_OFFSET = 3; // leftmost pixel of a row; bytes per pixel; alpha offset
const ALPHA_THRESHOLD = 128; // a pixel is set when its alpha reaches one half
const UNITS_PER_PX = 100; // TTF units per pixel: an em of 1600 units is drawn as 16 px
// TTF layout: sfnt header and table record fields, then the head unitsPerEm and hhea ascender offsets.
const SFNT_COUNT = 4, SFNT_HEADER = 12, SFNT_RECORD = 16, TAG_LENGTH = 4, TABLE_OFFSET_FIELD = 8;
const HEAD_UPEM = 18, HHEA_ASCENDER = 4;
const EGA = { w: 8, h: 14 }, VGA = { w: 9, h: 16 }; // output cells; the fonts are drawn at their native size
const HEADER = "// Generated by tools/fonts.html from the rv_font headers and PxPlus IBM TTF files.\n";
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
// Codes in ascending order, the order of every output table.
const CODES = [...range(ASCII_FIRST, ASCII_LAST), CYR_IO, ...range(CYR_FIRST, CYR_LAST), CYR_IO_LOWER];
// file: pages cannot use fetch, so the sources are read with XMLHttpRequest.
function load(url, type) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", url);
    xhr.responseType = type;
    xhr.onload = () => {
      if (xhr.response && (xhr.status === 0 || xhr.status === 200)) resolve(xhr.response);
      else reject(new Error(url + ": read failed, status " + xhr.status));
    };
    xhr.onerror = () => reject(new Error(url + ": read failed"));
    xhr.send();
  });
}
// Bytes of `uint8_t NAME[...] = { ... };`, with // comments cut as in tools/build_rvfont.py.
function table(text, name, glyphs) {
  const head = new RegExp("uint8_t\\s+" + name + "\\s*\\[[^\\]]*\\]\\s*=\\s*\\{").exec(text);
  const end = head && text.indexOf("};", head.index);
  if (!head || end < 0) throw new Error(name + ": table not found");
  const body = text.slice(head.index + head[0].length, end).split("\n").map((line) => line.split("//")[0]).join("\n");
  const bytes = [...body.matchAll(/0x([0-9A-Fa-f]{2})/g)].map((m) => parseInt(m[1], 16));
  if (bytes.length !== glyphs * RV_ROWS) throw new Error(name + ": " + bytes.length + " bytes, expected " + glyphs * RV_ROWS);
  return bytes;
}
// Byte offset of a TTF table, found through the table records.
function tableOffset(bytes, tag) {
  const view = new DataView(bytes);
  for (let i = 0; i < view.getUint16(SFNT_COUNT); i++) {
    const rec = SFNT_HEADER + i * SFNT_RECORD;
    if (String.fromCharCode(...new Uint8Array(bytes, rec, TAG_LENGTH)) === tag) return view.getUint32(rec + TABLE_OFFSET_FIELD);
  }
  throw new Error("TTF: no " + tag + " table");
}
// Native size and baseline in px: head unitsPerEm and hhea ascender, each divided by UNITS_PER_PX.
function nativeMetrics(bytes) {
  const view = new DataView(bytes);
  const head = tableOffset(bytes, "head"), hhea = tableOffset(bytes, "hhea");
  return { px: view.getUint16(head + HEAD_UPEM) / UNITS_PER_PX, ascent: view.getInt16(hhea + HHEA_ASCENDER) / UNITS_PER_PX };
}
const rowsAt = (bits, i) => Array.from(bits.slice(i * RV_ROWS, (i + 1) * RV_ROWS));
// Slot order of rv_font_cyrillic.hpp (its line 13): U+0410..U+044F, then slot 64 is U+0401 (Ё) and slot 65 is U+0451 (ё).
const cyrCode = (slot) => (slot < CYR_RANGE ? CYR_FIRST + slot : slot === CYR_RANGE ? CYR_IO : CYR_IO_LOWER);
// Code -> rows for both rv_font tables; the notdef glyph after the ASCII range is skipped.
function rvMap(ascii, cyr) {
  const map = new Map();
  for (let i = 0; i < ASCII_COUNT; i++) map.set(ASCII_FIRST + i, rowsAt(ascii, i));
  for (let s = 0; s < CYR_GLYPHS; s++) map.set(cyrCode(s), rowsAt(cyr, s));
  return map;
}
// Registers a TTF under a private family name so that canvas can use it.
async function loadFace(family, bytes) {
  const face = new FontFace(family, bytes);
  document.fonts.add(await face.load());
  return family;
}
const packRows = (pixels, cell) => {
  const rows = [];
  for (let y = 0; y < cell.h; y++) {
    let row = 0;
    for (let x = 0; x < Math.min(cell.w, BITS_PER_ROW); x++) {
      if (pixels[(y * cell.w + x) * RGBA_STRIDE + ALPHA_OFFSET] >= ALPHA_THRESHOLD) row |= FIRST_BIT_MASK >> x;
    }
    rows.push(row);
  }
  return rows;
};
// Draws each code at the font's native pixel size in its cell; the thresholded pixels become the rows.
function rasterize(family, cell, m) {
  const canvas = document.createElement("canvas");
  canvas.width = cell.w;
  canvas.height = cell.h;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.font = m.px + "px " + family;
  ctx.textBaseline = "alphabetic"; // baseline is the font's ascender, so the position does not depend on the browser
  const map = new Map();
  for (const code of CODES) {
    ctx.clearRect(0, 0, cell.w, cell.h);
    ctx.fillText(String.fromCodePoint(code), 0, m.ascent);
    map.set(code, packRows(ctx.getImageData(0, 0, cell.w, cell.h).data, cell));
  }
  return map;
}
const hex = (b) => "0x" + b.toString(16).toUpperCase().padStart(2, "0");
// One line per code: "  65: [0x00, ...],".
function moduleText(name, map) {
  const lines = CODES.map((code) => "  " + code + ": [" + map.get(code).map(hex).join(", ") + "],");
  return "export const " + name + " = {\n" + lines.join("\n") + "\n};\n";
}
async function build(base) {
  const [data, cyr, ega, vga] = await Promise.all([
    load(base + DATA_PATH, "text"),
    load(base + CYR_PATH, "text"),
    load(base + EGA_PATH, "arraybuffer"),
    load(base + VGA_PATH, "arraybuffer"),
  ]);
  const rv = rvMap(table(data, "rv_font_bits", ASCII_GLYPHS), table(cyr, "rv_font_cyrillic_bits", CYR_GLYPHS));
  const egaM = nativeMetrics(ega);
  const vgaM = nativeMetrics(vga);
  const egaMap = rasterize(await loadFace("PxEga", ega), EGA, egaM);
  const vgaMap = rasterize(await loadFace("PxVga", vga), VGA, vgaM);
  return HEADER + moduleText("RV_FONT", rv) + moduleText("EGA_8X14", egaMap) + moduleText("VGA_9X16", vgaMap);
}
async function main() {
  const out = document.getElementById("out");
  if (!SRC) {
    out.textContent = "src parameter is required";
    return;
  }
  try {
    const text = await build(SRC.endsWith("/") ? SRC : SRC + "/");
    out.textContent = text;
    const dl = document.getElementById("dl");
    dl.href = "data:text/javascript;charset=utf-8," + encodeURIComponent(text);
    dl.hidden = false;
  } catch (e) {
    out.textContent = "error: " + e.message;
  }
}
window.addEventListener("load", main);
</script>
