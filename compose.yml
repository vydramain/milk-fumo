name: milk-fumo

# The values come from the env file given with --env-file (.env.dev or .env.prod).
# The container listens on port 80; HOST_PORT is published on 127.0.0.1 only.
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:?set HOST_PORT in the env file}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/srv/site:ro
      # The content is edited over SFTP on the host; the container only reads it.
      - ${CONTENT_DIR:?set CONTENT_DIR in the env file}:/srv/content:ro
