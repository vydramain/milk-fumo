name: milk-fumo

# Значения берутся из env-файла (--env-file .env.dev или .env.prod); переменная окружения shell переопределяет их.
# Контейнер слушает порт 80; на 127.0.0.1 публикуется HOST_PORT.
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:?задайте HOST_PORT в env-файле}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/srv/site:ro
      # Контент правится по SFTP на хосте; контейнер только читает, не пишет.
      - ${CONTENT_DIR:?задайте CONTENT_DIR в env-файле}:/srv/content:ro
